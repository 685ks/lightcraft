# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, the WiX installer and packaging/app.toml.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck
      - name: Validate the WiX XML and release metadata
        run: |
          set -euo pipefail
          xmllint --noout packaging/windows/lightcraft.wxs
          python3 -c 'import tomllib; d = tomllib.load(open("packaging/app.toml", "rb")); assert d["bundle_id"] == "app.freedev.ainz.ks.LightCraft" and d["publisher"] == "Arthavan Projects", d'
      - name: Shell scripts
        run: shellcheck -S error packaging/*.sh packaging/web/*.sh
      - name: App-specific installer and package checks
        run: bash packaging/check-app-specific.sh

  windows-install-folder:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install-folder fallback and precedence (real MSI AppSearch)
        shell: pwsh
        run: |
          ./packaging/windows/test-install-folder.ps1 -Arch x64
          ./packaging/windows/test-install-folder.ps1 -Arch x86
