# Checks on every pull request and every push to main, on Linux, macOS and Windows: formatting,
# Clippy, layering, the asset and parity checks, the rebrand guard, and the tests. Until this fork
# tests only ran on FreeBSD; now every crate's tests run on all three systems.
#
# Every action is pinned by commit SHA. Values from the event go through `env:`, never straight
# into a `run:` script. Tests that need a GPU, the corpus, craft-fonts or a model skip themselves
# (`lightcraft_testkit::skip!`), so the runners need none of those.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Tests never touch the user's settings or GPU.
  LIGHTCRAFT_NO_PREFS: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      # This fork carries no ArtCraft marks or links and no storytold/craft-common-actions
      # workflows (house rules). LICENSE and NOTICE keep the upstream copyright line.
      - name: Rebrand guard
        run: |
          set -euo pipefail
          if git grep -nI 'craft-common-actions' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::storytold/craft-common-actions is not used in this fork"; exit 1
          fi
          if git grep -nIi -e 'getartcraft' -e 'discord\.gg/artcraft' -e 'storyteller\.ai' -e 'ai\.storyteller\.lightcraft' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::ArtCraft/storyteller links or ids remain"; exit 1
          fi
          if [ -d docs/brand ]; then echo "::error::docs/brand (ArtCraft marks) must not exist"; exit 1; fi
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Layering, assets and parity tracker
        run: |
          cargo xtask layers
          cargo xtask assets
          cargo xtask parity
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space and install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146
      # Timing-sensitive UI tests run alone (.config/nextest.toml). One retry on top: a few UI tests
      # wait on background renders with a time budget, which a busy shared runner can miss. A test
      # that fails twice still fails the job, and nextest lists every retried test as flaky.
      - name: Test the workspace
        shell: bash
        run: cargo nextest run --locked --workspace --no-fail-fast --retries 1 --status-level fail --final-status-level flaky --failure-output final
      - name: Doc tests
        shell: bash
        run: cargo test --locked --workspace --doc
